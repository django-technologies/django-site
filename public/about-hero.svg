<!--?xml version="1.0" encoding="UTF-8"?-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title>Abstract quantitative motif</title>
  <desc>Composição minimalista com colunas arredondadas ascendentes, grid sutil e linhas-sinal nas cores da Django.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F8FB"></stop>
      <stop offset="1" stop-color="#FFFFFF"></stop>
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect x="0" y="0" width="1600" height="420" fill="url(#bg)"></rect>

  <!-- Grid sutil -->
  <g stroke="#E9EDF2" stroke-width="1">
    <!-- verticais -->
    <line x1="0" y1="0" x2="0" y2="420"></line>
    <line x1="80" y1="0" x2="80" y2="420"></line>
    <line x1="160" y1="0" x2="160" y2="420"></line>
    <line x1="240" y1="0" x2="240" y2="420"></line>
    <line x1="320" y1="0" x2="320" y2="420"></line>
    <line x1="400" y1="0" x2="400" y2="420"></line>
    <line x1="480" y1="0" x2="480" y2="420"></line>
    <line x1="560" y1="0" x2="560" y2="420"></line>
    <line x1="640" y1="0" x2="640" y2="420"></line>
    <line x1="720" y1="0" x2="720" y2="420"></line>
    <line x1="800" y1="0" x2="800" y2="420"></line>
    <line x1="880" y1="0" x2="880" y2="420"></line>
    <line x1="960" y1="0" x2="960" y2="420"></line>
    <line x1="1040" y1="0" x2="1040" y2="420"></line>
    <line x1="1120" y1="0" x2="1120" y2="420"></line>
    <line x1="1200" y1="0" x2="1200" y2="420"></line>
    <line x1="1280" y1="0" x2="1280" y2="420"></line>
    <line x1="1360" y1="0" x2="1360" y2="420"></line>
    <line x1="1440" y1="0" x2="1440" y2="420"></line>
    <line x1="1520" y1="0" x2="1520" y2="420"></line>
    <line x1="1600" y1="0" x2="1600" y2="420"></line>
    <!-- horizontais -->
    <line x1="0" y1="0" x2="1600" y2="0"></line>
    <line x1="0" y1="80" x2="1600" y2="80"></line>
    <line x1="0" y1="160" x2="1600" y2="160"></line>
    <line x1="0" y1="240" x2="1600" y2="240"></line>
    <line x1="0" y1="320" x2="1600" y2="320"></line>
    <line x1="0" y1="400" x2="1600" y2="400"></line>
    <line x1="0" y1="420" x2="1600" y2="420"></line>
  </g>

  <!-- Colunas ascendentes (eco do logomark) -->
  <g transform="translate(160,60)">
    <rect x="0" y="170" width="80" height="150" rx="40" ry="40" fill="#AEB3B9"></rect>
    <rect x="120" y="120" width="80" height="200" rx="40" ry="40" fill="#7A8088"></rect>
    <rect x="240" y="60" width="80" height="260" rx="40" ry="40" fill="#3E444B"></rect>
    <!-- arcos internos -->
    <ellipse cx="40" cy="300" rx="36" ry="28" fill="#FFFFFF" opacity="0.25"></ellipse>
    <ellipse cx="160" cy="300" rx="36" ry="28" fill="#FFFFFF" opacity="0.22"></ellipse>
    <ellipse cx="280" cy="300" rx="36" ry="28" fill="#FFFFFF" opacity="0.18"></ellipse>
  </g>

  <!-- Linhas-sinal -->
  <path d="M520 260 C600 200, 700 320, 780 260 S 960 200, 1040 260 S 1120 320, 1200 260" fill="none" stroke="#0FB5B3" stroke-width="3"></path>
  <path d="M520 290 C600 230, 700 350, 780 290 S 960 230, 1040 290 S 1120 350, 1200 290" fill="none" stroke="#2D6AE3" stroke-width="2" opacity="0.8"></path>

  <!-- Pontos discretos -->
  <g fill="#2A2F36" opacity="0.25">
    <circle cx="920" cy="140" r="3"></circle><circle cx="980" cy="180" r="3"></circle>
    <circle cx="1040" cy="120" r="3"></circle><circle cx="1100" cy="200" r="3"></circle>
  </g>

  <!-- Cartão à direita -->
  <g transform="translate(1260,88)">
    <rect x="0" y="0" width="220" height="180" rx="16" ry="16" fill="#E9EDF2"></rect>
    <circle cx="40" cy="40" r="6" fill="#2D6AE3"></circle>
    <circle cx="64" cy="40" r="6" fill="#0FB5B3"></circle>
    <rect x="36" y="72" width="148" height="10" rx="5" ry="5" fill="#111418" opacity="0.4"></rect>
    <rect x="36" y="96" width="132" height="10" rx="5" ry="5" fill="#111418" opacity="0.3"></rect>
    <rect x="36" y="120" width="168" height="10" rx="5" ry="5" fill="#111418" opacity="0.2"></rect>
  </g>
</svg>
