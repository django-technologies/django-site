<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title>Django Technologies logomark</title>
  <desc>Three ascending rounded columns in the Django Technologies green and graphite identity.</desc>
  <defs>
    <linearGradient id="bar-left" x1="60" y1="104" x2="60" y2="218" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#51D63B"/>
      <stop offset="0.48" stop-color="#6DB85C"/>
      <stop offset="1" stop-color="#56585C"/>
    </linearGradient>
    <linearGradient id="bar-center" x1="128" y1="64" x2="128" y2="218" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#51D63B"/>
      <stop offset="0.5" stop-color="#6CB85C"/>
      <stop offset="1" stop-color="#56585C"/>
    </linearGradient>
    <linearGradient id="bar-right" x1="196" y1="24" x2="196" y2="218" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#51D63B"/>
      <stop offset="0.52" stop-color="#69B95A"/>
      <stop offset="1" stop-color="#56585C"/>
    </linearGradient>
  </defs>
  <g shape-rendering="geometricPrecision">
    <rect x="38" y="104" width="44" height="114" rx="22" ry="22" fill="url(#bar-left)"/>
    <rect x="106" y="64" width="44" height="154" rx="22" ry="22" fill="url(#bar-center)"/>
    <rect x="174" y="24" width="44" height="194" rx="22" ry="22" fill="url(#bar-right)"/>
  </g>
</svg>
